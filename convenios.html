<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIS-Gestión Premium</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0f172a;
            --accent: #3b82f6;
            --bg: #f1f5f9;
            --card: #ffffff;
            --con: #8b5cf6;
            --sin: #0ea5e9;
            --vencido: #ef4444;
            --proceso: #f59e0b;
        }

        body {
            margin: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg);
            color: var(--primary);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 260px;
            background: var(--primary);
            color: white;
            display: flex;
            flex-direction: column;
            padding: 24px;
            gap: 8px;
        }

        .sidebar h1 { font-size: 1.2rem; margin-bottom: 30px; font-weight: 700; letter-spacing: -0.5px; }
        
        .nav-link {
            text-decoration: none;
            color: #94a3b8;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 0.9rem;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-link:hover, .nav-link.active { background: rgba(255,255,255,0.1); color: white; }

        /* Main Content */
        .main-content {
            flex: 1;
            padding: 32px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .header-stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .stat-card {
            background: var(--card);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: transform 0.2s;
            border-bottom: 4px solid transparent;
        }

        .stat-card:hover { transform: translateY(-5px); }
        .stat-card h4 { margin: 0; font-size: 0.8rem; color: #64748b; text-transform: uppercase; }
        .stat-card .value { font-size: 1.8rem; font-weight: 700; margin: 8px 0 0 0; }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 24px;
            flex: 1;
            min-height: 500px;
        }

        .panel {
            background: var(--card);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
        }

        /* Buscador */
        .search-box {
            margin-bottom: 16px;
            padding: 10px 16px;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            width: 100%;
            box-sizing: border-box;
            font-family: inherit;
        }

        /* Tabla */
        .table-container {
            flex: 1;
            overflow-y: auto;
            border: 1px solid #f1f5f9;
            border-radius: 12px;
        }

        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        th { background: #f8fafc; padding: 14px; text-align: left; position: sticky; top: 0; color: #64748b; font-weight: 600; }
        td { padding: 14px; border-bottom: 1px solid #f1f5f9; }
        tr:hover { background: #f8fafc; }

        .badge {
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .chart-container { position: relative; height: 300px; width: 100%; }

        /* Estilos específicos por estado */
        .card-con { border-color: var(--con); }
        .card-sin { border-color: var(--sin); }
        .card-vencido { border-color: var(--vencido); }
        .card-proceso { border-color: var(--proceso); }
    </style>
</head>
<body>

    <aside class="sidebar">
        <h1>SIS-Gestión</h1>
        <nav>
            <a href="#" class="nav-link active">📊 Dashboard Convenios</a>
            <a href="#" class="nav-link">🏫 Campos Clínicos</a>
            <a href="#" class="nav-link">👨‍⚕️ Residentado</a>
            <a href="#" class="nav-link">📄 Reportes</a>
        </nav>
    </aside>

    <main class="main-content">
        <div class="header-stats">
            <div class="stat-card card-con" onclick="filtrar('CON INTERNOS')">
                <h4>Con Internos</h4>
                <p class="value" style="color:var(--con)">24</p>
            </div>
            <div class="stat-card card-sin" onclick="filtrar('SIN INTERNOS')">
                <h4>Sin Internos</h4>
                <p class="value" style="color:var(--sin)">10</p>
            </div>
            <div class="stat-card card-vencido" onclick="filtrar('VENCIDO CON INTERNOS')">
                <h4>Vencidos</h4>
                <p class="value" style="color:var(--vencido)">3</p>
            </div>
            <div class="stat-card card-proceso" onclick="filtrar('EN PROCESO DE RENOVACIÓN CON INTERNOS')">
                <h4>En Proceso</h4>
                <p class="value" style="color:var(--proceso)">2</p>
            </div>
        </div>

        <div class="dashboard-grid">
            <div class="panel">
                <h3 style="margin-top:0">Distribución Global</h3>
                <div class="chart-container">
                    <canvas id="convenioChart"></canvas>
                </div>
                <p style="text-align: center; color: #64748b; font-size: 0.8rem; margin-top: 20px;">
                    Total de 39 convenios registrados
                </p>
            </div>

            <div class="panel">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                    <h3 style="margin:0">Listado Detallado</h3>
                    <input type="text" id="busqueda" class="search-box" placeholder="Buscar universidad..." style="width: 250px; margin:0">
                </div>
                
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>UNIVERSIDAD</th>
                                <th>FACULTAD</th>
                                <th>VIGENCIA</th>
                            </tr>
                        </thead>
                        <tbody id="tablaBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

            { UNIVERSIDAD: "UNIVERSIDAD SAN MARTIN DE PORRES", FACULTAD: "FACULTAD DE COMUNICACIÓN, TURISMO Y PSICOLOGIA", ESTADO: "CON INTERNOS", VIGENCIA: "28/11/2026" },
            { UNIVERSIDAD: "UNIVERSIDAD TECNOLÓGICA DEL PERÚ", FACULTAD: "FACULTAD DE CIENCIAS DE LA SALUD", ESTADO: "CON INTERNOS", VIGENCIA: "21/07/2026" },
        ];

    let chart;
    let filtroActual = 'CON INTERNOS';

    function actualizarTabla(busqueda = '') {
        const body = document.getElementById("tablaBody");
        const filtrados = datos.filter(d => 
            d.ESTADO === filtroActual && 
            d.UNIVERSIDAD.toLowerCase().includes(busqueda.toLowerCase())
        );

        body.innerHTML = filtrados.map(d => `
            <tr>
                <td><strong>${d.UNIVERSIDAD}</strong></td>
                <td>${d.FACULTAD}</td>
                <td><span class="badge" style="background:${filtroActual.includes('VENCIDO') ? '#fee2e2' : '#f1f5f9'}; color:${filtroActual.includes('VENCIDO') ? '#ef4444' : '#475569'}">
                    ${d.VIGENCIA || 'Pendiente'}
                </span></td>
            </tr>
        `).join('');
    }

    function filtrar(estado) {
        filtroActual = estado;
        actualizarTabla();
    }

    document.getElementById('busqueda').addEventListener('input', (e) => actualizarTabla(e.target.value));

    document.addEventListener('DOMContentLoaded', () => {
        const ctx = document.getElementById('convenioChart').getContext('2d');
        chart = new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: ['En Proceso', 'Vencido', 'Sin Internos', 'Con Internos'],
                datasets: [{
                    data: [2, 3, 10, 24],
                    backgroundColor: ['#f59e0b', '#ef4444', '#0ea5e9', '#8b5cf6'],
                    borderWidth: 0,
                    hoverOffset: 20
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                cutout: '70%',
                plugins: {
                    legend: { position: 'bottom', labels: { usePointStyle: true, padding: 20, font: { family: 'Plus Jakarta Sans', size: 12 } } },
                    datalabels: { color: '#fff', font: { weight: 'bold' } }
                }
            },
            plugins: [ChartDataLabels]
        });
        actualizarTabla();
    });
</script>
</body>
</html>
