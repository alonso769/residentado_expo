<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIS-Gestión Premium - Campos Clínicos</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0f172a;
            --accent: #3b82f6;
            --bg: #f8fafc;
            --card: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
        }

        body {
            margin: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar idéntica a tus otras páginas */
        .sidebar {
            width: 280px;
            background: var(--primary);
            color: white;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex-shrink: 0;
            box-shadow: 4px 0 10px rgba(0,0,0,0.1);
        }

        .sidebar h1 { font-size: 1.4rem; margin-bottom: 30px; font-weight: 700; border-left: 4px solid var(--accent); padding-left: 15px; }
        
        .nav-buttons { display: flex; flex-direction: column; gap: 12px; }

        .nav-buttons a {
            text-decoration: none;
            color: #94a3b8;
            padding: 14px 18px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.3s ease;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.05);
            text-align: center;
        }

        .nav-buttons a:hover {
            background: var(--accent);
            color: white;
            transform: translateX(5px);
        }

        .nav-buttons a.active { background: var(--accent); color: white; }

        /* Contenedor Principal */
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 25px;
            gap: 20px;
            min-width: 0;
        }

        .panel-full {
            flex: 1;
            background: var(--card);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header-chart {
            margin-bottom: 20px;
            border-bottom: 1px solid #f1f5f9;
            padding-bottom: 15px;
        }

        .header-chart h2 { margin: 0; font-size: 1.4rem; font-weight: 700; color: var(--primary); }
        .header-chart p { margin: 5px 0 0 0; color: var(--text-muted); font-size: 0.9rem; }

        .chart-wrapper {
            flex: 1;
            position: relative;
            min-height: 0;
        }
    </style>
</head>
<body>

    <aside class="sidebar">
        <h1>UNIDAD DE DOCENCIA E INVESTIGACIÓN</h1>
         <div class="nav-buttons">
        <a href="https://docenciaweb.vercel.app" style="background: rgba(59, 130, 246, 0.2); color: #fff; border: 1px solid var(--accent);">
            <i class="fas fa-house" style="margin-right: 10px;"></i> Salir
        </a>
        <div class="nav-buttons">
            <a href="convenios.html">Convenios por Universidad</a>
            <a href="grafico_barra.html">Estados de EESS</a>
            <a href="campos_clinicos.html" class="active">N° Campos por Carrera</a>
            <a href="residentado.html">Residentado</a>
            <a href="conapres.html">CONAPRES</a>
            <a href="matriz_evaluacion.html">MATRIZ DE EVALUACIÓN</a>
        </div>
    </aside>

    <main class="main-container">
        <div class="panel-full">
            <div class="header-chart">
                <h2>Campos Clínicos por Carrera</h2>
                <p>Comparativa de capacidad del Primer Nivel de Atención (2025 vs 2026)</p>
            </div>
            
            <div class="chart-wrapper">
                <canvas id="camposClinicosChart"></canvas>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const ctx = document.getElementById('camposClinicosChart').getContext('2d');

            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: [
                        'MEDICINA HUMANA', 'ENFERMERÍA', 'OBSTETRICIA', 'ODONTOLOGÍA', 
                        'NUTRICIÓN', 'LAB. CLÍNICO', 'TERAPIA FÍSICA', 'RADIOLOGÍA', 
                        'TERAPIA LENGUAJE', 'TERAPIA OCUPACIONAL', 'OPTOMETRÍA', 
                        'FARMACIA', 'PSICOLOGÍA', 'BIOLOGÍA', 'TRABAJO SOCIAL', 
                        'MEDICINA VET.', 'ING. SANITARIA', 'QUÍMICA'
                    ],
                    datasets: [
                        {
                            label: 'Metas 2026',
                            data: [505, 558, 256, 153, 219, 136, 49, 37, 37, 26, 11, 103, 311, 20, 113, 37, 6, 5],
                            backgroundColor: '#3b82f6',
                            borderRadius: 5,
                        },
                        {
                            label: 'Cierre 2025',
                            data: [300, 311, 161, 121, 160, 119, 32, 29, 20, 17, 10, 79, 153, 44, 8, 0, 0, 0],
                            backgroundColor: '#e2e8f0',
                            borderRadius: 5,
                        }
                    ]
                },
                options: {
                    indexAxis: 'y', // Diseño horizontal para mejor legibilidad
                    responsive: true,
                    maintainAspectRatio: false,
                    devicePixelRatio: window.devicePixelRatio || 2, // Nitidez máxima
                    plugins: {
                        legend: {
                            position: 'top',
                            align: 'end',
                            labels: { usePointStyle: true, font: { family: 'Plus Jakarta Sans', size: 12, weight: '600' } }
                        },
                        datalabels: {
                            anchor: 'end',
                            align: 'right',
                            color: '#475569',
                            font: { weight: 'bold', size: 10 },
                            formatter: (val) => val > 0 ? val : ''
                        },
                        tooltip: {
                            backgroundColor: '#0f172a',
                            padding: 12,
                            cornerRadius: 10
                        }
                    },
                    scales: {
                        x: {
                            grid: { display: false, drawBorder: false },
                            ticks: { display: false }
                        },
                        y: {
                            grid: { display: false },
                            ticks: { font: { family: 'Plus Jakarta Sans', size: 11, weight: '600' }, color: '#1e293b' }
                        }
                    }
                },
                plugins: [ChartDataLabels]
            });
        });
    </script>
</body>
</html>
